   version: 1
   frontend:
     phases:
       preBuild:
         commands:
           - npm ci
       build:
         commands:
           - env | egrep 'SUPABASE_SERVICE_ROLE_KEY|UPSTASH_REDIS_REST_URL|UPSTASH_REDIS_REST_TOKEN|OPENROUTER_API_KEY|OPENROUTER_BASE_URL|OPENROUTER_MODEL|OPENROUTER_FALLBACK_MODELS|RESEND_API_KEY|BUNNY_STREAM_LIBRARY_ID|BUNNY_STREAM_API_KEY|BUNNY_STREAM_CDN_HOSTNAME|SMS_WEBHOOK_SECRET|NEXT_PUBLIC_' >> .env.production
           - npm run build
     artifacts:
       baseDirectory: .next
       files:
         - '**/*'
     cache:
       paths:
         - node_modules/**/*
         - .next/cache/**/*
